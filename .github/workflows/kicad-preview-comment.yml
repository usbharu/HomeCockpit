name: KiCad preview comment

on:
  workflow_run:
    workflows: [KiCad previews]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: kicad-preview-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Comment KiCad previews on PR
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v7
        with:
          # workflow_run's github.sha is the default-branch commit, never the PR head.
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verify source run and find preview artifact
        id: source
        uses: actions/github-script@v9
        with:
          script: |
            const { prepare } = require('./trusted/.github/scripts/comment-kicad-previews.cjs');
            const source = await prepare({ github, context, core });
            if (source) core.setOutput('artifact-id', source.artifact.id);
      - name: Download preview data outside the trusted checkout
        if: steps.source.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/kicad-previews
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create or update preview comment
        if: steps.source.outputs.artifact-id != ''
        uses: actions/github-script@v9
        env:
          PREVIEW_DIR: ${{ runner.temp }}/kicad-previews
        with:
          script: |
            const publish = require('./trusted/.github/scripts/comment-kicad-previews.cjs');
            await publish({ github, context, core, directory: process.env.PREVIEW_DIR });
