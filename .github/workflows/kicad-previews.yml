name: KiCad previews

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - 'upper_panel_ddi/pcb/**'
      - 'firmware/upper_panel_ddi/**'
      - 'HomeCockpit.kicad_sym'
      - 'Library.pretty/**'
      - '.github/workflows/kicad-previews.yml'
      - '.github/workflows/kicad-preview-comment.yml'
      - '.github/scripts/render-kicad-previews.py'
      - '.github/scripts/comment-kicad-previews.cjs'
      - '.github/scripts/tests/**'

permissions:
  contents: read

concurrency:
  group: kicad-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    name: Render changed KiCad designs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test preview detection and comments
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'
          node --test .github/scripts/tests/*.test.cjs
      - name: Detect designs including newly added projects
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/kicad-previews
        run: |
          python3 .github/scripts/render-kicad-previews.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --output "$OUTPUT_DIR" --plan-only
          python3 -c 'import json, os; print("count=" + str(len(json.load(open(os.environ["OUTPUT_DIR"] + "/manifest.json"))["entries"])))' >> "$GITHUB_OUTPUT"
      - name: Install PNG converter
        if: steps.plan.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y librsvg2-bin
      - name: Render before and after images
        if: steps.plan.outputs.count != '0'
        env:
          OUTPUT_DIR: ${{ runner.temp }}/kicad-previews
        run: python3 .github/scripts/render-kicad-previews.py --output "$OUTPUT_DIR"
      - name: Upload previews
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: kicad-previews
          path: ${{ runner.temp }}/kicad-previews
          if-no-files-found: error
