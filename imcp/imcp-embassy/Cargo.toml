[package]
name = "imcp-embassy"
version = "0.1.0"
edition = "2024"

[dependencies]
imcp = { path = "../" }
embassy-sync = { version = "0.8.0" }

[dev-dependencies]
embassy-sync = { version = "0.8.0", features = ["std"] }
embassy-executor = { version = "0.10.0", features = ["platform-std"] }
critical-section = { version = "1.2", features = ["std"] }
imcp = {path = "../",features = ["test-utils"]}
futures = "0.3.31"
