[target.thumbv6m-none-eabi]
# runner = "elf2uf2-rs -d"
runner = "probe-rs run --chip RP2040"

[target.thumbv8m.main-none-eabihf]
runner = "probe-rs run --chip RP235x --protocol swd --connect-under-reset"
rustflags = [
    "-C",
    "link-arg=--nmagic",
    "-C",
    "link-arg=-Tlink.x",
    "-C",
    "link-arg=-Tdefmt.x",
    "-C",
    "target-cpu=cortex-m33",
]

[build]
target = "thumbv6m-none-eabi" # Cortex-M0 and Cortex-M0+ (default: RP2040)

[env]
DEFMT_LOG = "debug"
