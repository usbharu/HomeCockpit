[package]
name = "upper_panel_ddi"
version = "0.1.0"
edition = "2024"

[features]
default = ["rp2040"]
# Host tests build the library without a board. Firmware binaries enable `device`.
device = [
    "dep:embassy-sync",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-rp",
    "dep:embassy-usb",
    "dep:embassy-usb-logger",
    "dep:embassy-futures",
    "dep:trouble-host",
    "dep:bt-hci",
    "dep:futures",
    "dep:cyw43",
    "dep:cyw43-pio",
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:panic-probe",
    "dep:static_cell",
    "dep:portable-atomic",
    "dep:log",
    "dep:imcp-embedded",
    "dep:imcp-embassy",
    "dep:embedded-io-async",
    "dep:hcp",
    "dep:homecockpit_firmware_base",
    "dep:heapless",
]
rp2040 = ["device", "embassy-rp/rp2040"]
rp235x = ["device", "embassy-rp/rp235xa"]

[dependencies]
embassy-sync = { version = "0.8.0", path = "../lib/embassy/embassy-sync", optional = true, features = [
    "defmt",
] }
embassy-executor = { version = "0.10.0", path = "../lib/embassy/embassy-executor", optional = true, default-features = false, features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
    "executor-interrupt",
] }
embassy-time = { version = "0.5.1", path = "../lib/embassy/embassy-time", optional = true, default-features = false, features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.10.0", path = "../lib/embassy/embassy-rp", optional = true, default-features = false, features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
] }
embassy-usb = { version = "0.6.0", path = "../lib/embassy/embassy-usb", optional = true, features = [
    "defmt",
] }
embassy-usb-logger = { version = "0.6.0", path = "../lib/embassy/embassy-usb-logger", optional = true }
embassy-futures = { version = "0.1.2", path = "../lib/embassy/embassy-futures", optional = true }

trouble-host = { path = "../lib/trouble/host", optional = true, features = ["scan"] }
bt-hci = { version = "0.10", optional = true, default-features = false, features = ["defmt"] }

futures = { version = "0.3", optional = true, default-features = false, features = [
    "async-await",
] }
cyw43 = { version = "0.7.0", path = "../lib/embassy/cyw43", optional = true, features = [
    "defmt",
    "firmware-logs",
    "bluetooth",
] }
cyw43-pio = { version = "0.10.0", path = "../lib/embassy/cyw43-pio", optional = true, features = [
    "defmt",
] }

defmt = { version = "1.0", optional = true }
defmt-rtt = { version = "1.0.0", optional = true }

cortex-m = { version = "0.7.7", optional = true }
cortex-m-rt = { version = "0.7.5", optional = true }
panic-probe = { version = "1.0", optional = true, features = ["print-defmt"] }
static_cell = { version = "2", optional = true }
portable-atomic = { version = "1.11", optional = true, features = ["critical-section"] }
log = { version = "0.4", optional = true }

imcp-embedded = { path = "../../imcp/imcp-embedded", optional = true, features = ["defmt", "embassy-rp"] }
imcp-embassy = { path = "../../imcp/imcp-embassy", optional = true }
imcp = { path = "../../imcp", features = ["defmt"] }

embedded-io-async = { version = "0.7.0", optional = true }
hcp = { path = "../hcp", optional = true, features = ["defmt"] }
homecockpit_firmware_base = { path = "../homecockpit_firmware_base", optional = true, features = ["defmt"] }

heapless = { version = "0.9.1", optional = true, features = ["defmt"] }

[patch.crates-io]
embassy-time-driver = { path = "../lib/embassy/embassy-time-driver" }
embassy-sync = { path = "../lib/embassy/embassy-sync" }
embassy-rp = { path = "../lib/embassy/embassy-rp" }

[[bin]]
name = "upper_panel_ddi"
test = false
bench = false
required-features = ["device"]


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
unwrap_used = "forbid"
panic = "forbid"

large_stack_arrays = "forbid"

float_arithmetic = "forbid"
float_cmp = "forbid"
cast_possible_truncation = "forbid"
cast_sign_loss = "forbid"
cast_possible_wrap = "warn"

[dev-dependencies]
proptest = "1.11.0"
